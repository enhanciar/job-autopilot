target_per_day: 100
resume:
  max_pages: 2          # projects are always kept; content is only trimmed past this limit
review_mode: true
apply:
  mode: script     # script = rule-based filler first, Claude (Sonnet) takes over whatever it cannot finish
outreach:
  people_per_company: 10      # how many people to approach per company: one message each, spread across roles
# Boards whose own "Apply" is a paywall or a dead end. Jobs from these are still discovered, scored and prepared, but the
# route to the company is a person on LinkedIn, never a form on the board.
outreach_only_sources:
  - weworkremotely
fit_threshold: 65
auto_submit_min_score: 75
llm:
  default: claude-cli
  routes:
    score: claude-cli
    tailor: claude-cli
    outreach: claude-cli
    classify: claude-cli
    factcheck: claude-cli
    profile_extract: claude-cli
    form_agent: claude-cli
  models:
    gemini: gemini-3.5-flash-lite
    openrouter: anthropic/claude-sonnet-4.5
    ollama: llama3.1:8b
    claude-cli: claude-haiku-4-5-20251001
  task_models:
    gemini:
      tailor: gemini-3.8-flash
      outreach: gemini-3.8-flash
    claude-cli:
      tailor: claude-sonnet-5
      outreach: claude-sonnet-5
      profile_extract: claude-sonnet-5
      form_agent: claude-sonnet-5      # deciding what to do on an unfamiliar form is reasoning, not classification
# Rolling seven-day ceilings. LinkedIn allows roughly 100 invitations a week on a free or Premium account and counts
# them from your first invitation of the week, so a daily cap alone is not enough to stay inside it.
browser:
  hidden: false     # true moves the automation window off-screen; it returns automatically when a login or CAPTCHA needs you

weekly_caps:
  linkedin:
    connects: 80
    dms: 100

humanize:
  action_delay_s:
  - 2
  - 8
  between_items_s:
  - 20
  - 90
  idle_pause_chance: 0.08
  idle_pause_s:
  - 15
  - 60
  typing_cps:
  - 6
  - 14
  business_hours:
